# Deploys the site on every push to main, and rebuilds it each weekday after the ECB publishes
# its reference rates so pound and dollar prices follow the euro. The daily run deploys only when
# the rates changed. Every deploy needs every test to pass first.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
name: Deploy and daily exchange rates

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * 1-5' # 16:00 UTC, after the ECB's ~16:00 CET publication in summer and winter
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Daily run stops if the rates did not change
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git diff --quiet src/data/rates.json; then echo "deploy=no" >> "$GITHUB_OUTPUT"; else echo "deploy=yes" >> "$GITHUB_OUTPUT"; cat src/data/rates.json; fi
      - if: steps.changed.outputs.deploy == 'yes'
        run: npm test && npm run test:dist
      - if: steps.changed.outputs.deploy == 'yes'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
