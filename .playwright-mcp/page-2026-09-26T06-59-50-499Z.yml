      - region [ref=e340]:
        - heading "How to choose a crochet bag" [level=2] [ref=e341]
        - paragraph [ref=e342]:
          - text: Phone bags run small on purpose. Most sit 10 to 15 cm wide with a strap between 100 and 130 cm, long enough to wear crossbody with your phone, cards and lip balm inside and both hands free. Totes and shoulder bags run bigger, 25 to 37 cm wide, with room for a water bottle, a paperback or an 11-inch tablet. The
          - link "daisy granny square tote" [ref=e343] [cursor=pointer]:
            - /url: /products/daisy-granny-square-tote-bag-with-matching-coin/
          - text: is a good example, with its own coin purse that clips to the handle.
        - paragraph [ref=e344]:
          - text: "For a phone, check the width and fit listed on each product page: the"
          - link "frog phone crossbody" [ref=e345] [cursor=pointer]:
            - /url: /products/frog-phone-crossbody/
          - text: ", for example, fits phones up to 6.7 inches. Straps vary by design: some are a fixed crossbody length, others adjust. Size names can mean different things, too. On the frog phone crossbody, \"regular\" and \"large\" refer to the bag's height, 39 cm or 48 cm, both on the same 120 cm strap."
        - paragraph [ref=e346]:
          - text: Buying for someone else, a character bag like the
          - link "giraffe crossbody for kids" [ref=e347] [cursor=pointer]:
            - /url: /products/giraffe-crossbody-bag-for-kids/
          - text: or a
          - link "tassel phone bag" [ref=e348] [cursor=pointer]:
            - /url: /products/tassel-crossbody-phone-bag/
          - text: makes a gift with a story attached, and every piece lists its size so there's no guessing. Hand-worked yarn means a centimetre or two of variation from the photos, and washing instructions live on each product page.
      - region [ref=e349]:
        - heading "Good to know" [level=2] [ref=e350]
        - generic [ref=e351]:
          - term [ref=e352]: What phone sizes fit in a crossbody bag?
          - definition [ref=e353]: Each product page lists its exact width and what fits. The frog phone crossbody, for example, fits phones up to 6.7 inches.
          - term [ref=e354]: Can I adjust the strap length?
          - definition [ref=e355]: Some straps adjust between crossbody and shoulder length, others are a fixed length. Check the size and materials list on the product page for that detail.
          - term [ref=e356]: What are the bags made from?
          - definition [ref=e357]: Cotton, polyester or acrylic yarn, depending on the design, with no animal wool anywhere. The daisy granny square tote, for example, is cotton. Each product page lists its exact materials.
          - term [ref=e358]: How much can a bag differ from the photos?
          - definition [ref=e359]: Each bag is crocheted by hand, so expect 1 to 3 cm of size variation from the listed measurements.
